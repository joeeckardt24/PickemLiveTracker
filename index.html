<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football Live Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function FantasyFootballTracker() {
            // Load initial state from localStorage
            const loadState = () => {
                try {
                    const saved = localStorage.getItem('fantasyFootballData');
                    if (saved) {
                        const data = JSON.parse(saved);
                        // Force update to Week 15 if currently less than 15
                        if (data.currentWeek < 15) {
                            data.currentWeek = 15;
                        }
                        return data;
                    }
                } catch (e) {
                    console.error('Error loading saved data:', e);
                }
                return {
                    players: [
                        { id: 1, name: 'Player 1', seasonWins: 0, currentWeekPicks: [] },
                        { id: 2, name: 'Player 2', seasonWins: 0, currentWeekPicks: [] },
                        { id: 3, name: 'Player 3', seasonWins: 0, currentWeekPicks: [] },
                        { id: 4, name: 'Player 4', seasonWins: 0, currentWeekPicks: [] }
                    ],
                    games: [],
                    currentWeek: 15
                };
            };

            const [players, setPlayers] = useState(() => loadState().players);
            const [games, setGames] = useState(() => loadState().games);
            const [currentWeek, setCurrentWeek] = useState(() => loadState().currentWeek);
            const [editMode, setEditMode] = useState(false);
            const [editGamesMode, setEditGamesMode] = useState(false);
            const [autoUpdate, setAutoUpdate] = useState(true);
            const [lastFetch, setLastFetch] = useState(null);
            const [fetchError, setFetchError] = useState(null);
            const [isFetching, setIsFetching] = useState(false);
            const [showImport, setShowImport] = useState(false);
            const [importText, setImportText] = useState('');
            const [importError, setImportError] = useState('');

            // Save to localStorage
            useEffect(() => {
                const data = { players, games, currentWeek };
                localStorage.setItem('fantasyFootballData', JSON.stringify(data));
            }, [players, games, currentWeek]);

            // Import picks from text
            const importPicks = () => {
                try {
                    setImportError('');
                    const text = importText.trim();
                    const updates = {};
                    
                    console.log('Starting tab-separated import...');
                    
                    const lines = text.split('\n');
                    
                    const yahooToESPN = {
                        'TB': 'TB', 'CHI': 'CHI', 'BAL': 'BAL', 'KC': 'KC', 'NE': 'NE', 
                        'NYG': 'NYG', 'WAS': 'WSH', 'PHI': 'PHI', 'JAX': 'JAX', 'HOU': 'HOU',
                        'CLE': 'CLE', 'LAC': 'LAC', 'BUF': 'BUF', 'CIN': 'CIN', 'GB': 'GB',
                        'LAR': 'LAR', 'NO': 'NO', 'SF': 'SF', 'SEA': 'SEA', 'DAL': 'DAL',
                        'MIA': 'MIA', 'DET': 'DET', 'MIN': 'MIN', 'ATL': 'ATL', 'CAR': 'CAR',
                        'DEN': 'DEN', 'IND': 'IND', 'LV': 'LV', 'TEN': 'TEN', 'ARI': 'ARI', 
                        'PIT': 'PIT', 'NYJ': 'NYJ',
                        'Chi': 'CHI', 'Bal': 'BAL', 'Was': 'WSH', 'Phi': 'PHI', 'Jax': 'JAX',
                        'Hou': 'HOU', 'Cle': 'CLE', 'Buf': 'BUF', 'Cin': 'CIN', 'Sea': 'SEA',
                        'Dal': 'DAL', 'Mia': 'MIA', 'Det': 'DET', 'Min': 'MIN', 'Atl': 'ATL',
                        'Car': 'CAR', 'Den': 'DEN', 'Ind': 'IND', 'Ten': 'TEN', 'Ari': 'ARI',
                        'Pit': 'PIT'
                    };
                    
                    const allTeamAbbrs = [...new Set(games.flatMap(g => [g.homeTeam, g.awayTeam]))];
                    
                    lines.forEach((line, idx) => {
                        line = line.trim();
                        if (!line) return;
                        
                        // Split by tab
                        const parts = line.split('\t');
                        
                        if (parts.length < 2) {
                            console.log(`Line ${idx}: Not enough parts (${parts.length})`);
                            return;
                        }
                        
                        const playerName = parts[0].trim();
                        const teamPicks = parts.slice(1).map(t => t.trim().toUpperCase()).filter(t => t.length > 0);
                        
                        console.log(`"${playerName}": ${teamPicks.length} teams`, teamPicks);
                        
                        // Convert Yahoo to ESPN
                        const espnTeams = teamPicks.map(t => yahooToESPN[t] || t).filter(t => allTeamAbbrs.includes(t));
                        
                        // Find player
                        const player = players.find(p => {
                            const norm1 = p.name.toLowerCase().replace(/[^a-z0-9]/g, '');
                            const norm2 = playerName.toLowerCase().replace(/[^a-z0-9]/g, '');
                            return norm1 === norm2;
                        });
                        
                        if (player && espnTeams.length > 0) {
                            updates[player.id] = espnTeams;
                            console.log(`✓ "${playerName}" → "${player.name}"`);
                        } else if (espnTeams.length > 0) {
                            console.log(`✗ No match for "${playerName}"`);
                        }
                    });
                    
                    if (Object.keys(updates).length === 0) {
                        setImportError('No players matched. Check console (F12).');
                        return;
                    }
                    
                    setPlayers(players.map(player => {
                        if (updates[player.id]) {
                            const newPicks = updates[player.id].map(teamAbbr => {
                                const game = games.find(g => g.homeTeam === teamAbbr || g.awayTeam === teamAbbr);
                                return game ? { gameId: game.id, team: teamAbbr } : null;
                            }).filter(Boolean);
                            return { ...player, currentWeekPicks: newPicks };
                        }
                        return player;
                    }));
                    
                    setShowImport(false);
                    setImportText('');
                    alert(`✓ Imported ${Object.keys(updates).length} players!`);
                } catch (error) {
                    console.error('Import error:', error);
                    setImportError(`Error: ${error.message}`);
                }
            };

            // Fetch live NFL scores from ESPN API
            const fetchLiveScores = async () => {
                if (isFetching) return false;
                
                try {
                    setIsFetching(true);
                    setFetchError(null);
                    
                    const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
                    
                    if (!response.ok) {
                        throw new Error(`API returned status ${response.status}`);
                    }

                    const data = await response.json();
                    console.log('ESPN API Response:', data);
                    
                    // Log first event to see structure
                    if (data.events && data.events.length > 0) {
                        console.log('First event full structure:', JSON.stringify(data.events[0], null, 2));
                        if (data.events[0].competitions && data.events[0].competitions[0]) {
                            console.log('Competition situation:', data.events[0].competitions[0].situation);
                            console.log('Competitors:', data.events[0].competitions[0].competitors);
                        }
                    }
                    
                    if (data.events && data.events.length > 0) {
                        const newGames = [];
                        
                        data.events.forEach(event => {
                            const competition = event.competitions[0];
                            const homeTeam = competition.competitors.find(c => c.homeAway === 'home');
                            const awayTeam = competition.competitors.find(c => c.homeAway === 'away');
                            
                            // Check for possession - could be in situation.possession or competitor.possession
                            let possession = null;
                            if (competition.situation && competition.situation.possession) {
                                possession = competition.situation.possession;
                            } else if (homeTeam.possession) {
                                possession = homeTeam.team.id;
                            } else if (awayTeam.possession) {
                                possession = awayTeam.team.id;
                            }
                            
                            const apiGame = {
                                homeTeam: homeTeam.team.abbreviation,
                                awayTeam: awayTeam.team.abbreviation,
                                homeScore: parseInt(homeTeam.score) || 0,
                                awayScore: parseInt(awayTeam.score) || 0,
                                isFinal: competition.status.type.state === 'post',
                                isPreGame: competition.status.type.state === 'pre',
                                quarter: competition.status.period || 0,
                                clock: competition.status.displayClock || '',
                                statusDetail: competition.status.type.detail || '',
                                gameTime: event.date || '',
                                shortDetail: competition.status.type.shortDetail || '',
                                possession: possession,
                                homeTeamId: homeTeam.team.id,
                                awayTeamId: awayTeam.team.id
                            };

                            // Find existing game with same matchup to preserve ID
                            const existingGame = games.find(g => 
                                g.homeTeam === apiGame.homeTeam && g.awayTeam === apiGame.awayTeam
                            );
                            
                            newGames.push({
                                id: existingGame ? existingGame.id : (newGames.length + 1),
                                ...apiGame
                            });
                        });

                        // Sort games: live first, then upcoming (pre-game), then final
                        const sortedGames = newGames.sort((a, b) => {
                            // Live games (not final, not pre-game) = priority 1
                            const aIsLive = !a.isFinal && !a.isPreGame;
                            const bIsLive = !b.isFinal && !b.isPreGame;
                            
                            if (aIsLive && !bIsLive) return -1;
                            if (!aIsLive && bIsLive) return 1;
                            
                            // Pre-game = priority 2
                            if (a.isPreGame && !b.isPreGame) return -1;
                            if (!a.isPreGame && b.isPreGame) return 1;
                            
                            // Final games = priority 3
                            if (a.isFinal && !b.isFinal) return 1;
                            if (!a.isFinal && b.isFinal) return -1;
                            
                            return 0;
                        });
                        
                        setGames(sortedGames);
                        setLastFetch(new Date());
                        setIsFetching(false);
                        console.log('Loaded games:', sortedGames);
                        return true;
                    } else {
                        setFetchError('No games found for today');
                        setIsFetching(false);
                        return false;
                    }
                } catch (error) {
                    console.error('Error fetching NFL data:', error);
                    setFetchError(`${error.message}`);
                    setIsFetching(false);
                    return false;
                }
            };

            // Auto-update effect
            useEffect(() => {
                if (autoUpdate) {
                    fetchLiveScores();
                    const interval = setInterval(() => {
                        fetchLiveScores();
                    }, 15000);
                    return () => clearInterval(interval);
                }
            }, [autoUpdate]);

            // Game management functions
            const addGame = () => {
                const newId = games.length > 0 ? Math.max(...games.map(g => g.id)) + 1 : 1;
                setGames([...games, {
                    id: newId,
                    homeTeam: '',
                    awayTeam: '',
                    homeScore: 0,
                    awayScore: 0,
                    isFinal: false,
                    isPreGame: true,
                    gameTime: new Date().toISOString()
                }]);
            };

            const updateGame = (gameId, field, value) => {
                setGames(games.map(game => 
                    game.id === gameId ? { ...game, [field]: value } : game
                ));
            };

            const removeGame = (gameId) => {
                setGames(games.filter(g => g.id !== gameId));
                setPlayers(players.map(player => ({
                    ...player,
                    currentWeekPicks: player.currentWeekPicks.filter(pick => pick.gameId !== gameId)
                })));
            };

            // Player management
            const addPlayer = () => {
                const newId = Math.max(...players.map(p => p.id)) + 1;
                setPlayers([...players, { 
                    id: newId, 
                    name: `Player ${newId}`, 
                    seasonWins: 0, 
                    currentWeekPicks: [] 
                }]);
            };

            const removePlayer = (playerId) => {
                if (players.length > 2) {
                    setPlayers(players.filter(p => p.id !== playerId));
                }
            };

            const updatePlayer = (playerId, field, value) => {
                setPlayers(players.map(player =>
                    player.id === playerId ? { ...player, [field]: value } : player
                ));
            };

            const handleSeasonWinsChange = (playerId, value) => {
                const wins = parseInt(value) || 0;
                updatePlayer(playerId, 'seasonWins', Math.max(0, wins));
            };

            // Pick management
            const handlePickChange = (playerId, gameId, team) => {
                setPlayers(players.map(player => {
                    if (player.id === playerId) {
                        const existingPickIndex = player.currentWeekPicks.findIndex(p => p.gameId === gameId);
                        const newPicks = [...player.currentWeekPicks];
                        
                        if (team === '') {
                            if (existingPickIndex >= 0) {
                                newPicks.splice(existingPickIndex, 1);
                            }
                        } else {
                            if (existingPickIndex >= 0) {
                                newPicks[existingPickIndex] = { gameId, team };
                            } else {
                                newPicks.push({ gameId, team });
                            }
                        }
                        
                        return { ...player, currentWeekPicks: newPicks };
                    }
                    return player;
                }));
            };

            // Calculate weekly wins (including games in progress based on current score)
            const calculateWeeklyWins = () => {
                return players.map(player => {
                    let weekWins = 0;
                    let gamesInProgress = 0;
                    let liveWins = 0; // Currently winning in live games
                    
                    player.currentWeekPicks.forEach(pick => {
                        const game = games.find(g => g.id === pick.gameId);
                        if (game) {
                            const pickedTeamScore = pick.team === game.homeTeam ? game.homeScore : game.awayScore;
                            const otherTeamScore = pick.team === game.homeTeam ? game.awayScore : game.homeScore;
                            
                            const isWinning = pickedTeamScore > otherTeamScore;
                            
                            // Count as win if picked team is currently winning (regardless of final status)
                            if (isWinning) {
                                weekWins++;
                                // If game is still live and we're winning, count it
                                if (!game.isFinal) {
                                    liveWins++;
                                }
                            }
                            
                            // Track if this is a game in progress
                            if (!game.isFinal) {
                                gamesInProgress++;
                            }
                        }
                    });
                    
                    return { ...player, weekWins, gamesInProgress, liveWins };
                });
            };

            // Get standings with projected season wins
            const getStandings = () => {
                const playersWithWeekWins = calculateWeeklyWins();
                
                // Add projected season wins to each player (current season wins + current week wins)
                const playersWithProjected = playersWithWeekWins.map((player, index) => ({
                    ...player,
                    projectedSeasonWins: player.seasonWins + player.weekWins,
                    originalIndex: index  // Track original position for stable sort
                }));
                
                // Sort by projected season wins, then by original position (stable sort)
                return playersWithProjected.sort((a, b) => {
                    if (b.projectedSeasonWins !== a.projectedSeasonWins) {
                        return b.projectedSeasonWins - a.projectedSeasonWins;
                    }
                    // If tied, maintain original order (whoever was first stays first)
                    return a.originalIndex - b.originalIndex;
                });
            };

            // Finalize week
            const finalizeWeek = () => {
                if (!window.confirm(`Finalize Week ${currentWeek}?\n\nThis will:\n• Lock in all week ${currentWeek} results\n• Add week wins to season totals\n• Clear all picks\n• Clear all games\n• Prepare for Week ${currentWeek + 1}\n\nContinue?`)) {
                    return;
                }

                const playersWithWeekWins = calculateWeeklyWins();
                
                setPlayers(players.map(player => {
                    const playerWithWins = playersWithWeekWins.find(p => p.id === player.id);
                    return {
                        ...player,
                        seasonWins: player.seasonWins + (playerWithWins?.weekWins || 0),
                        currentWeekPicks: []
                    };
                }));
                
                setCurrentWeek(prev => prev + 1);
                setGames([]);
                alert(`✅ Week ${currentWeek} finalized!\n\n• Week wins added to season totals\n• All picks cleared\n• All games cleared\n\nNow starting Week ${currentWeek + 1}.\n\nClick REFRESH to load next week's games.`);
            };

            const resetAll = () => {
                if (window.confirm('Reset ALL data? This cannot be undone!')) {
                    localStorage.removeItem('fantasyFootballData');
                    window.location.reload();
                }
            };

            const exportData = () => {
                const dataToExport = {
                    players: players,
                    games: games,
                    currentWeek: currentWeek,
                    exportDate: new Date().toISOString()
                };
                
                const dataStr = JSON.stringify(dataToExport, null, 2);
                const dataBlob = new Blob([dataStr], {type: 'application/json'});
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'fantasy-football-week' + currentWeek + '-' + new Date().toISOString().split('T')[0] + '.json';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                alert('Data exported! Check your downloads folder.');
            };

            const importData = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const importedData = JSON.parse(event.target.result);
                            
                            if (!importedData.players || !Array.isArray(importedData.players)) {
                                alert('Invalid file format.');
                                return;
                            }
                            
                            if (window.confirm('Import data from Week ' + importedData.currentWeek + '? This will replace all current data.')) {
                                setPlayers(importedData.players || []);
                                setGames(importedData.games || []);
                                setCurrentWeek(importedData.currentWeek || 15);
                                alert('Data imported successfully!');
                            }
                        } catch (error) {
                            alert('Error reading file.');
                            console.error('Import error:', error);
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            };

            const standings = getStandings();
            
            // Debug: log standings when they change
            useEffect(() => {
                console.log('Standings updated:', standings.map(p => ({
                    name: p.name,
                    weekWins: p.weekWins,
                    seasonWins: p.seasonWins,
                    projected: p.projectedSeasonWins
                })));
            }, [games, players]);

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-800 p-4 md:p-6">
                    <div className="max-w-5xl mx-auto">
                        <div className="text-center mb-8">
                            <h1 className="text-4xl md:text-5xl font-bold text-white mb-2">
                                🏆 Fantasy Football Live Tracker
                            </h1>
                            <div className="flex items-center justify-center gap-2">
                                <p className="text-blue-200 text-lg">Week</p>
                                <input 
                                    type="number" 
                                    min="1" 
                                    max="18" 
                                    value={currentWeek} 
                                    onChange={(e) => setCurrentWeek(parseInt(e.target.value) || 1)}
                                    className="bg-blue-900 text-blue-200 text-lg font-bold border border-blue-400 rounded px-2 py-1 w-16 text-center"
                                />
                            </div>
                            <div className="mt-3 flex gap-2 justify-center flex-wrap">
                                <button onClick={exportData} className="text-xs text-green-300 hover:text-green-100 underline">
                                    💾 Export Data
                                </button>
                                <span className="text-blue-300">|</span>
                                <button onClick={importData} className="text-xs text-purple-300 hover:text-purple-100 underline">
                                    📥 Import Data
                                </button>
                                <span className="text-blue-300">|</span>
                                <button onClick={resetAll} className="text-xs text-blue-300 hover:text-blue-100 underline">
                                Reset All Data
                            </button>
                        </div>
                        </div>

                        {/* Two Column Layout: NFL Scores Left, Standings Right */}
                        <div className="grid grid-cols-1 lg:grid-cols-5 gap-6 mb-6">
                            {/* Left Column: NFL Scores (Vertical) */}
                            <div className="lg:col-span-2">
                                <div className="bg-white rounded-xl shadow-2xl p-6 sticky top-4">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-bold text-gray-800">🏈 Live Scores</h2>
                                        <button onClick={() => setEditGamesMode(!editGamesMode)} className="text-sm px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded">
                                            {editGamesMode ? '✓' : '✏️'}
                                        </button>
                                    </div>
                                    
                                    {games.length === 0 ? (
                                        <p className="text-gray-500 text-sm text-center py-4">No games loaded</p>
                                    ) : (
                                        <div className="grid grid-cols-4 gap-1">
                                            {games.map(game => (
                                                <div key={game.id} className="bg-gray-50 rounded p-2 border border-gray-300 w-[92px]">
                                                    <div className="flex justify-between items-center">
                                                        <span className={`font-bold text-base ${game.awayScore > game.homeScore ? 'text-green-700' : 'text-gray-700'}`}>
                                                            {game.awayTeam}
                                                            {game.possession === game.awayTeamId && <span className="text-xs ml-0.5">🏈</span>}
                                                        </span>
                                                        <span className={`text-sm font-bold ${game.awayScore > game.homeScore ? 'text-green-700' : 'text-gray-800'}`}>{game.awayScore}</span>
                                                    </div>
                                                    <div className="flex justify-between items-center">
                                                        <span className={`font-bold text-base ${game.homeScore > game.awayScore ? 'text-green-700' : 'text-gray-700'}`}>
                                                            {game.homeTeam}
                                                            {game.possession === game.homeTeamId && <span className="text-xs ml-0.5">🏈</span>}
                                                        </span>
                                                        <span className={`text-sm font-bold ${game.homeScore > game.awayScore ? 'text-green-700' : 'text-gray-800'}`}>{game.homeScore}</span>
                                                    </div>
                                                    <div className="text-center mt-0.5">
                                                        {game.isFinal ? (
                                                            <span className="text-white text-xs px-1.5 py-0.5 rounded-full bg-gray-500 font-bold">FINAL</span>
                                                        ) : game.isPreGame && game.gameTime ? (
                                                            <div className="text-xs text-blue-600 font-bold leading-tight">
                                                                <div>{new Date(game.gameTime).toLocaleDateString('en-US', { weekday: 'short' })}</div>
                                                                <div>{new Date(game.gameTime).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true })}</div>
                                                            </div>
                                                        ) : (game.statusDetail && game.statusDetail.toLowerCase().includes('half')) ? (
                                                            <div className="text-xs text-orange-600 font-bold">HALF</div>
                                                        ) : game.quarter ? (
                                                            <div className="text-xs text-gray-700 font-semibold leading-tight">
                                                                <div>Q{game.quarter}</div>
                                                                <div>{game.clock}</div>
                                                            </div>
                                                        ) : (
                                                            <span className="text-white text-xs px-1.5 py-0.5 rounded-full bg-red-500 font-bold">L</span>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    
                                    {/* Fetch Controls - Bottom */}
                                    <div className="mt-3 pt-3 border-t border-gray-200 space-y-2">
                                        <button onClick={fetchLiveScores} disabled={isFetching} className="w-full px-3 py-2 bg-red-600 hover:bg-red-700 disabled:bg-red-300 text-white rounded font-semibold text-sm">
                                            {isFetching ? '⏳ Loading...' : '🔄 Refresh'}
                                        </button>
                                        <label className="flex items-center gap-2 px-3 py-2 bg-gray-100 rounded cursor-pointer">
                                            <input type="checkbox" checked={autoUpdate} onChange={(e) => setAutoUpdate(e.target.checked)} className="w-4 h-4" />
                                            <span className="text-gray-700 text-sm">Auto (15s)</span>
                                        </label>
                                        {lastFetch && <div className="text-xs text-gray-500 text-center">Updated: {lastFetch.toLocaleTimeString()}</div>}
                                    </div>
                                </div>
                            </div>

                            {/* Right Column: Standings */}
                            <div className="lg:col-span-3">
                        {/* Standings - Horizontal Layout */}
                        <div className="bg-white rounded-xl shadow-2xl p-6 mb-6" style={{maxWidth: 'calc(66.666% * 1.45)'}}>
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-2xl font-bold text-gray-800">LIVE STANDINGS</h2>
                                <p className="text-sm text-gray-600">
                                    {games.some(g => !g.isFinal) ? '⚡ Live - Projected if games end now' : 'Final Results'}
                                </p>
                            </div>
                            <div className="space-y-1">
                                {standings.map((player, index) => {
                                    const hasGamesInProgress = games.some(g => !g.isFinal);
                                    const weekWinChange = player.weekWins;
                                    
                                    return (
                                        <div key={player.id} className={`p-1.5 rounded border flex items-center ${
                                                index === 0 ? 'bg-green-50 border-green-300' :
                                                index === 1 ? 'bg-blue-50 border-blue-300' :
                                                index === 2 ? 'bg-orange-50 border-orange-300' :
                                                'bg-white border-gray-200'
                                            }`}>
                                            <span className="text-base font-bold text-gray-600 w-10"># {index + 1}</span>
                                            <span className="font-bold text-gray-800 w-48">{player.name}</span>
                                            <span className={`text-lg font-bold ${hasGamesInProgress && weekWinChange > 0 ? 'text-green-600' : 'text-gray-900'} w-12 text-center`}>
                                                {player.projectedSeasonWins}
                                            </span>
                                            <span className="w-12 text-center">
                                                {hasGamesInProgress && weekWinChange > 0 && (
                                                    <span className="text-sm text-green-600 font-bold">↑ +{weekWinChange}</span>
                                                )}
                                                {hasGamesInProgress && weekWinChange === 0 && (
                                                    <span className="text-sm text-gray-400 font-bold">→</span>
                                                )}
                                                {hasGamesInProgress && weekWinChange < 0 && (
                                                    <span className="text-sm text-red-600 font-bold">↓ {weekWinChange}</span>
                                                )}
                                            </span>
                                            <span className="text-sm text-gray-600 w-16 text-center">
                                                {player.weekWins}/{games.length}
                                            </span>
                                            <span className="text-sm text-green-600 flex-1">
                                                {player.gamesInProgress > 0 && (
                                                    <>Winning {player.liveWins}/{player.gamesInProgress} live</>
                                                )}
                                            </span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                            </div>
                        </div>

                        {/* Games section hidden - now in left sidebar */}
                        <div style={{display: 'none'}}>
                        <div className="bg-white rounded-xl shadow-2xl p-6 mb-6">
                            <div className="flex flex-wrap justify-between items-center gap-3 mb-4">
                                <h2 className="text-2xl font-bold text-gray-800">🏈 Games</h2>
                                <div className="flex flex-wrap gap-2">
                                    <button onClick={fetchLiveScores} disabled={isFetching} className="px-4 py-2 bg-red-600 hover:bg-red-700 disabled:bg-red-300 text-white rounded-lg font-bold">
                                        {isFetching ? '⏳ Loading...' : '🔄 Fetch Live Scores'}
                                    </button>
                                    <label className="flex items-center gap-2 px-4 py-2 bg-gray-100 rounded-lg cursor-pointer">
                                        <input type="checkbox" checked={autoUpdate} onChange={(e) => setAutoUpdate(e.target.checked)} className="w-4 h-4" />
                                        <span className="text-gray-700 text-sm">Auto (15s)</span>
                                    </label>
                                    <button onClick={() => setEditGamesMode(!editGamesMode)} className={`px-4 py-2 rounded-lg ${editGamesMode ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700'} text-white`}>
                                        {editGamesMode ? '✓ Done' : '✏️ Manual'}
                                    </button>
                                </div>
                            </div>

                            {fetchError && <div className="bg-red-100 border border-red-400 text-red-800 px-4 py-2 rounded mb-4 text-sm">⚠️ {fetchError}</div>}
                            {lastFetch && <div className="text-sm text-gray-500 mb-3">Updated: {lastFetch.toLocaleTimeString()} - {games.length} game(s) {autoUpdate && <span className="text-green-600">● Auto</span>}</div>}

                            {games.length === 0 ? (
                                <div className="text-center py-8">
                                    <p className="text-gray-500 mb-4">No games loaded</p>
                                    <button onClick={addGame} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold">Add Game</button>
                                </div>
                            ) : (
                                <div className="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-1">
                                    {games.map(game => (
                                        <div key={game.id} className="bg-gray-50 rounded p-1 border border-gray-300 w-35">
                                            {editGamesMode ? (
                                                <div className="space-y-1">
                                                    <div className="flex gap-1">
                                                        <input type="text" value={game.awayTeam} onChange={(e) => updateGame(game.id, 'awayTeam', e.target.value)} placeholder="Away" className="border border-gray-300 rounded px-1 py-0.5 text-[10px] w-12" />
                                                        <input type="number" value={game.awayScore} onChange={(e) => updateGame(game.id, 'awayScore', parseInt(e.target.value) || 0)} className="border border-gray-300 rounded px-1 py-0.5 text-[10px] w-8" />
                                                    </div>
                                                    <div className="flex gap-1">
                                                        <input type="text" value={game.homeTeam} onChange={(e) => updateGame(game.id, 'homeTeam', e.target.value)} placeholder="Home" className="border border-gray-300 rounded px-1 py-0.5 text-[10px] w-12" />
                                                        <input type="number" value={game.homeScore} onChange={(e) => updateGame(game.id, 'homeScore', parseInt(e.target.value) || 0)} className="border border-gray-300 rounded px-1 py-0.5 text-[10px] w-8" />
                                                    </div>
                                                    <div className="flex items-center justify-between text-[9px]">
                                                        <label className="flex items-center gap-0.5">
                                                            <input type="checkbox" checked={game.isFinal} onChange={(e) => updateGame(game.id, 'isFinal', e.target.checked)} className="w-2 h-2" />
                                                            <span>F</span>
                                                        </label>
                                                        <button onClick={() => removeGame(game.id)} className="text-red-600 text-sm">×</button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="text-sm leading-tight space-y-0.5">
                                                    <div className="flex justify-between items-center">
                                                        <span className={`font-semibold text-xl ${game.awayScore > game.homeScore ? 'text-green-700' : 'text-gray-700'}`}>{game.awayTeam}</span>
                                                        <span className={`text-xl font-bold ${game.awayScore > game.homeScore ? 'text-green-700' : 'text-gray-800'}`}>{game.awayScore}</span>
                                                    </div>
                                                    <div className="flex justify-between items-center">
                                                        <span className={`font-semibold text-xl ${game.homeScore > game.awayScore ? 'text-green-700' : 'text-gray-700'}`}>{game.homeTeam}</span>
                                                        <span className={`text-xl font-bold ${game.homeScore > game.awayScore ? 'text-green-700' : 'text-gray-800'}`}>{game.homeScore}</span>
                                                    </div>
                                                    <div className="text-center mt-1">
                                                        {game.isFinal ? (
                                                            <span className="text-white text-xs px-2 py-0.5 rounded-full bg-gray-500 font-bold">FINAL</span>
                                                        ) : game.isPreGame && game.gameTime ? (
                                                            <div className="text-sm text-blue-600 font-bold leading-tight">
                                                                <div>{new Date(game.gameTime).toLocaleDateString('en-US', { weekday: 'short' })}</div>
                                                                <div>{new Date(game.gameTime).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true })}</div>
                                                            </div>
                                                        ) : (game.statusDetail && game.statusDetail.toLowerCase().includes('half')) || (game.quarter === 2 && game.clock === '0:00') ? (
                                                            <div className="text-sm text-orange-600 font-bold">HALFTIME</div>
                                                        ) : game.quarter ? (
                                                            <div className="text-base text-gray-700 font-semibold leading-tight">
                                                                <div>Q{game.quarter}</div>
                                                                <div>{game.clock}</div>
                                                            </div>
                                                        ) : (
                                                            <span className="text-white text-xs px-2 py-0.5 rounded-full bg-red-500 font-bold">L</span>
                                                        )}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                    {editGamesMode && <button onClick={addGame} className="bg-blue-100 hover:bg-blue-200 text-blue-700 py-4 rounded font-semibold border-2 border-blue-300 border-dashed text-[10px]">+</button>}
                                </div>
                            )}
                        </div>
                        </div>
                    </div>
                    {/* Close max-w-5xl for Picks section */}

                        {/* Picks */}
                        {games.length > 0 && (
                            <div className="bg-white rounded-xl shadow-2xl p-8 mx-auto" style={{maxWidth: '1536px'}}>&lt;
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-2xl font-bold text-gray-800">📋 Picks</h2>
                                    <button onClick={() => setShowImport(!showImport)} className="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-semibold">
                                        📥 Quick Import
                                    </button>
                                </div>

                                {/* Import Modal */}
                                {showImport && (
                                    <div className="mb-6 bg-purple-50 border-2 border-purple-300 rounded-lg p-4">
                                        <h3 className="font-bold text-gray-800 mb-2">Import Picks from Yahoo</h3>
                                        <p className="text-sm text-gray-600 mb-3">
                                            Just paste the raw text from Yahoo Pick'em (one player per line):
                                        </p>
                                        <div className="bg-white p-2 rounded mb-3 text-xs font-mono text-gray-700">
                                            PicktasticTBChiBalKCNEWasPhiJaxHou<br/>
                                            DakAttackTBChiBalKCNENYGPhiJaxHou<br/>
                                            ChrisSolokasTBChiBalKCBufWasPhiJaxHou
                                        </div>
                                        <p className="text-xs text-gray-500 mb-3">
                                            <strong>Important:</strong> Player names in this app must match Yahoo names exactly. Update player names first using the Edit button in the Players section.
                                        </p>
                                        <textarea
                                            value={importText}
                                            onChange={(e) => setImportText(e.target.value)}
                                            className="w-full border border-gray-300 rounded p-3 text-sm font-mono h-48 mb-2"
                                            placeholder="Paste Yahoo picks here..."
                                        />
                                        {importError && (
                                            <div className="text-red-600 text-sm mb-2">⚠️ {importError}</div>
                                        )}
                                        <div className="flex gap-2">
                                            <button onClick={importPicks} className="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded font-semibold">
                                                Import Picks
                                            </button>
                                            <button onClick={() => { setShowImport(false); setImportText(''); setImportError(''); }} className="px-4 py-2 bg-gray-400 hover:bg-gray-500 text-white rounded">
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                )}
                                
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm">
                                        <thead className="bg-gray-100">
                                            <tr>
                                                <th className="px-3 py-3 text-left font-bold text-gray-700 sticky left-0 bg-gray-100 z-10 min-w-[100px] text-base">Player</th>
                                                {games.map(game => (
                                                    <th key={game.id} className="px-2 py-3 text-center font-bold text-gray-700 min-w-[60px]">
                                                        <div className="text-sm leading-tight">{game.awayTeam}</div>
                                                        <div className="text-xs leading-tight">@</div>
                                                        <div className="text-sm leading-tight">{game.homeTeam}</div>
                                                    </th>
                                                ))}
                                                <th className="px-3 py-3 text-center font-bold text-gray-700 sticky right-0 bg-gray-100 z-10 min-w-[50px] text-base">W</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {players.map(player => {
                                                const playerWithWins = calculateWeeklyWins().find(p => p.id === player.id);
                                                return (
                                                    <tr key={player.id} className="border-b hover:bg-gray-50">
                                                        <td className="px-3 py-3 font-bold text-gray-800 sticky left-0 bg-white z-10 text-sm">{player.name}</td>
                                                        {games.map(game => {
                                                            const pick = player.currentWeekPicks.find(p => p.gameId === game.id);
                                                            const pickedTeam = pick?.team;
                                                            let statusClass = 'border-gray-300 bg-white';
                                                            if (pickedTeam && game.isFinal) {
                                                                const isWinning = (pickedTeam === game.homeTeam && game.homeScore > game.awayScore) || (pickedTeam === game.awayTeam && game.awayScore > game.homeScore);
                                                                statusClass = isWinning ? 'bg-green-100 border-green-500 font-semibold' : 'bg-red-100 border-red-500';
                                                            } else if (pickedTeam) {
                                                                const isWinning = (pickedTeam === game.homeTeam && game.homeScore > game.awayScore) || (pickedTeam === game.awayTeam && game.awayScore > game.homeScore);
                                                                statusClass = isWinning ? 'bg-green-50 border-green-400' : 'bg-yellow-50 border-yellow-400';
                                                            }
                                                            return (
                                                                <td key={game.id} className="px-1 py-2 text-center">
                                                                    <select value={pickedTeam || ''} onChange={(e) => handlePickChange(player.id, game.id, e.target.value)} className={`border rounded px-1 py-1 text-sm w-full ${statusClass}`}>
                                                                        <option value="">-</option>
                                                                        {game.homeTeam && <option value={game.homeTeam}>{game.homeTeam}</option>}
                                                                        {game.awayTeam && <option value={game.awayTeam}>{game.awayTeam}</option>}
                                                                    </select>
                                                                </td>
                                                            );
                                                        })}
                                                        <td className="px-3 py-3 text-center font-bold text-lg sticky right-0 bg-white z-10">{playerWithWins?.weekWins || 0}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="mt-6 text-center">
                                    <button onClick={finalizeWeek} className="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-lg font-bold text-lg shadow-lg">
                                        Finalize Week {currentWeek}
                                    </button>
                                </div>
                            </div>
                        )}

                    {/* Reopen max-w-5xl for Players */}
                    <div className="max-w-5xl mx-auto">
                        {/* Players Management - Collapsible */}
                        <div className="bg-white rounded-xl shadow-2xl p-4 mt-6">
                            <button 
                                onClick={() => setEditMode(!editMode)} 
                                className="w-full flex items-center justify-between hover:bg-gray-50 p-2 rounded-lg transition"
                            >
                                <div className="flex items-center gap-2">
                                    <span className="text-xl">⚙️</span>
                                    <h2 className="text-lg font-bold text-gray-800">Manage Players ({players.length})</h2>
                                </div>
                                <span className="text-gray-500 text-sm">{editMode ? '▼ Hide' : '▶ Show'}</span>
                            </button>
                            
                            {editMode && (
                                <div className="space-y-3 mt-4 pt-4 border-t border-gray-200">
                                    {players.map(player => (
                                        <div key={player.id} className="bg-gray-50 rounded-lg p-4 border-2 border-gray-200">
                                            <div className="flex items-start gap-3">
                                                <div className="flex-1">
                                                    <input type="text" value={player.name} onChange={(e) => updatePlayer(player.id, 'name', e.target.value)} className="border border-gray-300 rounded px-3 py-2 w-full font-semibold mb-2" />
                                                    <div className="flex items-center gap-2">
                                                        <label className="text-sm text-gray-600">Season Wins:</label>
                                                        <input type="number" min="0" value={player.seasonWins} onChange={(e) => handleSeasonWinsChange(player.id, e.target.value)} className="border border-gray-300 rounded px-2 py-1 w-20" />
                                                    </div>
                                                </div>
                                                <button onClick={() => removePlayer(player.id)} disabled={players.length <= 2} className="text-red-600 hover:text-red-700 disabled:text-gray-400 disabled:cursor-not-allowed">
                                                    🗑️
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={addPlayer} className="w-full bg-blue-100 hover:bg-blue-200 text-blue-700 py-3 rounded-lg font-semibold border-2 border-blue-300 border-dashed">
                                        + Add Player
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<FantasyFootballTracker />, document.getElementById('root'));
    </script>
</body>
</html>
